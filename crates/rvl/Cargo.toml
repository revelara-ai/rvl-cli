[package]
name = "rvl"
description = "Revelara reliability scanner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
# The two native retriever helpers. They are dependencies of this package
# because their EXECUTABLES are bin targets of this package
# (src/bin/cindex.rs, src/bin/rustindex.rs) — see the RELEASE PACKAGING note
# at the bottom of this file. Neither is used by the `rvl` binary itself, so
# neither is linked into it; `rvl` still shells out to them at scan time.
cindex = { path = "../cindex" }
rustindex = { path = "../rustindex" }
rvl-cache = { path = "../rvl-cache" }
rvl-config = { path = "../rvl-config" }
rvl-content = { path = "../rvl-content" }
rvl-core = { path = "../rvl-core" }
rvl-data = { path = "../rvl-data" }
rvl-skills = { path = "../rvl-skills" }
rvl-spec = { path = "../rvl-spec" }
rvl-propagate = { path = "../rvl-propagate" }
rvl-triage = { path = "../rvl-triage" }
rvl-index = { path = "../rvl-index" }
rvl-structure = { path = "../rvl-structure" }
rvl-emission = { path = "../rvl-emission" }
serde = { workspace = true }
# Repo-evidence scope classification (po-av01j.173): `toml` reads the hatch
# build-hook declaration out of pyproject.toml, `ignore` walks the tree the
# way the config and content lanes do (gitignore-aware). Both already ship in
# the workspace via rvl-config, so neither adds to the dependency surface.
toml = "0.8"
ignore = "0.4"
serde_json = { workspace = true }
serde_yaml = { workspace = true }
# Content-addressing for the embedded scripted retrievers (po-aml3h): the
# extracted copy is rewritten when its hash differs from the embedded text, so
# a truncated or hand-edited helper heals instead of silently scanning wrong.
sha2 = { workspace = true }
hex = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
serde_json = { workspace = true }
# Lets the CLI tests hold redb's exclusive index lock directly, so the
# "index is busy" path is exercised deterministically instead of by racing
# two processes (po-l3jo5).
rvl-index = { path = "../rvl-index" }

# RELEASE PACKAGING (po-aml3h). A scan needs its retriever helpers, and before
# this each of cindex/rustindex was its own dist "app" — its own archive, its
# own Homebrew formula — so `brew install rvl` delivered the scanner and
# none of the retrievers, and the first scan of a polyglot repo hard-failed.
#
# `binaries` names the bins THIS PACKAGE builds, and they all go in the same
# archive — which is where resolution looks first (adjacent to the binary).
#
# WHY cindex/rustindex ARE BIN TARGETS OF *THIS* PACKAGE (po-av01j.154). This
# key is a filter over the package's own bin targets, not a way to borrow
# another package's. Listing helpers that lived in `crates/cindex` and
# `crates/rustindex` let `dist plan` resolve and print an archive containing
# all three, then failed at build time with "failed to find bin cindex for
# .../crates/rvl", because dist builds `-p rvl` and that package produced no
# such bin. So the executables are declared here, as `src/bin/cindex.rs` and
# `src/bin/rustindex.rs`, one-line shims over the sibling crates (now
# libraries). Those crates must NOT also define a bin of the same name: cargo
# warns "output filename collision" and which one lands at
# `target/<profile>/cindex` is arbitrary.
#
# Do not "simplify" this by cross-building the two into `dist-extras/` and
# shipping them via `include` the way goindex is. goindex has no choice — it
# is a Go build. These are cargo bins, and keeping them cargo bins is what
# makes dist build them for every target with the release profile, list them
# in dist-manifest.json as executables, and lets ci/render-cask.sh check the
# archive against that list. Moving them to `include` would silently drop
# them from that check.
#
# `include` carries goindex, which cargo cannot build: release CI cross-builds
# it per target into `dist-extras/` before `dist build` runs. It is not a cargo
# bin target, so Homebrew files it under `<prefix>/share/rvl` rather than
# in `bin` — `packaged_helper_dirs` in main.rs looks there for exactly that
# reason. csindex is deliberately absent: ~9 MB of Roslyn is more than the rest
# of the archive combined.
[package.metadata.dist]
binaries = { "*" = ["rvl", "cindex", "rustindex"] }
include = ["dist-extras/goindex"]
