# A dev-dependency of the crates whose tests drive a real engine (libclang,
# node, a JDK, rust-analyzer, ...). Never a dependency of shipped code.
[package.metadata.dist]
dist = false

[dev-dependencies]
serde_yaml = { workspace = true }
