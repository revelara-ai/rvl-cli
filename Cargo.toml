[workspace]
resolver = "2"
members = [
    "crates/rvlscan",
    "crates/rvl-cache",
    "crates/rvl-triage",
    "crates/rvl-index",
    "crates/rvl-core",
    "crates/rvl-spec",
    "crates/rvl-propagate",
    "crates/rvl-eval",
    "crates/rvl-structure",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/revelara-ai/rvlscan"
homepage = "https://revelara.ai"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ureq = "2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
