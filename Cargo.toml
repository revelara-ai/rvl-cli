[workspace]
resolver = "2"
members = [
    "crates/rvl",
    "crates/rvl-cache",
    "crates/rvl-content",
    "crates/rvl-triage",
    "crates/rvl-index",
    "crates/rvl-core",
    "crates/rvl-data",
    "crates/rvl-skills",
    "crates/rvl-spec",
    "crates/rvl-propagate",
    "crates/rvl-eval",
    "crates/rvl-config",
    "crates/rvl-structure",
    "crates/rvl-emission",
    "crates/cindex",
    "crates/rustindex",
]

# The rustindex fixture is its own cargo workspace (stub crates named like the
# real reqwest/sqlx/... so SCIP monikers are realistic); keep cargo from
# treating it as part of this one.
exclude = ["crates/rustindex/testdata/fixture"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/revelara-ai/rvl-cli"
homepage = "https://revelara.ai"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: correctly-rounded float parsing, matching Go's
# strconv.ParseFloat. Without it serde_json's fast path can land 1 ULP off and
# silently rewrite numbers on any JSON round trip (po-av01j.184).
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
regex = "1"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
ureq = "2"
tar = "0.4"
flate2 = "1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
