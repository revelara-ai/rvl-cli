version: 2
updates:
  # Rust workspace at the root covers every crate under crates/.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    # Major bumps are deliberately NOT auto-PR'd. A cargo major is a code
    # migration, not a version edit, and dependabot cannot write the
    # migration -- so every major PR arrives failing `fmt + clippy + test`
    # and sits red (#68-#75 were six of these at once, none security-driven).
    # Majors are scheduled as engineering work instead; several of this
    # crate's majors carry real compatibility stakes (ureq: the HTTP client
    # surface; redb: the packet index's on-disk format; ed25519-dalek: spec
    # cache signature verification against the server's signer). Security
    # advisories are unaffected: Dependabot security updates ignore this
    # filter and still open PRs at any semver level.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        update-types: ["minor", "patch"]
    # .github/workflows/release.yml is GENERATED by cargo-dist (`dist generate`,
    # pinned by cargo-dist-version in dist-workspace.toml), and `dist plan` in
    # CI fails the whole Release check when the file drifts from its generator.
    # Dependabot cannot exclude a single workflow file, so the actions that
    # appear in the generated file are ignored here by name. This is not
    # hypothetical: PRs #64/#65 bumped checkout and setup-go inside release.yml
    # and broke `dist plan` on every PR until regenerated.
    #
    # How these DO get upgraded:
    #   - checkout / upload-artifact / download-artifact: bump the cargo-dist
    #     version in dist-workspace.toml and run `dist generate` — the pins
    #     belong to dist.
    #   - setup-go: bump it in .github/build-setup.yml (the spliced source,
    #     which dependabot does not scan), then run `dist generate`.
    # The same actions in hand-written workflows (ci.yml) are also covered by
    # these ignores; bump those manually alongside.
    ignore:
      - dependency-name: "actions/checkout"
      - dependency-name: "actions/upload-artifact"
      - dependency-name: "actions/download-artifact"
      - dependency-name: "actions/setup-go"

  - package-ecosystem: "npm"
    directory: "/helpers/tsindex"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directory: "/helpers/goindex"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      gomod-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "nuget"
    directory: "/helpers/csindex"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]
