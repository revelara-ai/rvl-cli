# Extra steps spliced into dist's per-target build job (dist `github-build-setup`).
#
# goindex is the one retriever cargo cannot build (po-aml3h). Without this it
# is absent from the release archive, and a fresh `brew install rvlscan`
# followed by a scan of any Go repository hard-fails with "no goindex helper
# found" — the exact class of first-run failure this bead removes.
#
# The output lands in `crates/rvlscan/dist-extras/goindex`, which
# `[package.metadata.dist] include` packs into the archive next to the rvlscan
# binary; resolution then finds it with no environment set. The build MUST run
# before `dist build`, which is where dist splices these steps in.
- name: Install Go (for the goindex retriever)
  uses: actions/setup-go@v6
  with:
    go-version-file: helpers/goindex/go.mod
    cache: false
- name: Cross-build goindex for this target
  shell: bash
  run: |
    set -euo pipefail
    targets=(${{ join(matrix.targets, ' ') }})
    # `include` names ONE static path, so a job building two targets would
    # silently ship the second one's binary for both. Fail instead.
    if [ "${#targets[@]}" -ne 1 ]; then
      echo "goindex packaging assumes one target per job, got: ${targets[*]}" >&2
      exit 1
    fi
    case "${targets[0]}" in
      x86_64-apple-darwin)     export GOOS=darwin GOARCH=amd64 ;;
      aarch64-apple-darwin)    export GOOS=darwin GOARCH=arm64 ;;
      x86_64-unknown-linux-*)  export GOOS=linux  GOARCH=amd64 ;;
      aarch64-unknown-linux-*) export GOOS=linux  GOARCH=arm64 ;;
      *) echo "no GOOS/GOARCH mapping for ${targets[0]}" >&2; exit 1 ;;
    esac
    # CGO off so the helper is static and cross-builds without a C toolchain;
    # goindex drives the `go` tool at runtime, not libc-linked analysis.
    out="$GITHUB_WORKSPACE/crates/rvlscan/dist-extras/goindex"
    mkdir -p "$(dirname "$out")"
    CGO_ENABLED=0 go build -C helpers/goindex -trimpath -o "$out" .
    chmod +x "$out"
    file "$out" || true
