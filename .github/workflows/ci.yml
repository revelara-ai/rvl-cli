name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue proves a candidate by dispatching this workflow on
  # refs/heads/queue/pr-N and reading the `ci-gate` check run. No push trigger
  # may match queue or queue/**: a push run there would race the dispatch.
  workflow_dispatch:

permissions:
  contents: read

# github.event_name is part of the group so a dispatched run never cancels or
# replaces a push run or a pull_request run on the same ref. Only a superseded
# pull_request run is cancelled: a push run on main and a dispatched candidate
# run are each evidence somebody reads, so they run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A live test that cannot reach its engine (libclang, node and `typescript`,
  # a JDK, rust-analyzer, Go, python3, the .NET SDK) prints SKIP and passes on
  # a workstation. With this set it fails instead (crates/rvl-testgate), so a
  # green run here means every language lane executed. The `check` job
  # provisions each engine below; a runner that lacks one is red, not quiet.
  RVLSCAN_REQUIRE_ENGINES: "1"

# Runner selection follows the org convention: the `CI_RUNNER` variable selects
# the self-hosted fleet, and an unset variable falls back to GitHub-hosted.
# rvl goes PUBLIC at cutover (po-av01j.18), and public repos are kept on
# free GitHub-hosted minutes rather than the shared fleet -- at that point set a
# REPO-level `CI_RUNNER=""` to override the org value, no workflow edit needed.
jobs:
  # No display name on check or helpers: the merge queue reads each job's check
  # run by name, and the queue config names these jobs by their ids. A `name:`
  # here renames the check run and every proof fails with a missing job.
  # check: fmt, clippy and the workspace tests.
  check:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      # Self-hosted runners reuse the workspace across jobs, and a container
      # job elsewhere in the org (Semgrep runs as root) can leave root-owned
      # files this job's checkout cannot clean. Reclaim ownership first.
      # Skipped on GitHub-hosted runners, where every job is a fresh VM.
      - name: Reclaim workspace ownership (self-hosted runner hygiene)
        if: ${{ vars.CI_RUNNER != '' }}
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_WORKSPACE" 2>/dev/null || true

      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          # GitHub-hosted images ship rustup; the self-hosted fleet was
          # provisioned for Go/Node, so a runner joining it may not have it.
          # Install once rather than letting a new runner break the gate.
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          # rust-analyzer is the engine of the Rust lane (rustindex runs it),
          # and rust-src is the standard library source it indexes against.
          rustup toolchain install stable --profile minimal --component rustfmt,clippy,rust-analyzer,rust-src

      # On self-hosted runners the cargo registry and target dir persist on
      # local disk between jobs, so the GHA cache is a redundant multi-GB round
      # trip (it has already exceeded the 10 GB limit elsewhere in the org).
      - uses: Swatinem/rust-cache@v2
        if: ${{ vars.CI_RUNNER == '' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Builds cindex so the C/C++ live e2e runs instead of skipping itself.
      # A helper the suite never builds is a lane the suite never covers.
      # Both helpers are bin targets of the `rvl` PACKAGE (their crates are
      # libraries) so that release packaging can pack them beside `rvl` — see
      # the RELEASE PACKAGING note in crates/rvl/Cargo.toml.
      - name: Build the in-workspace helpers
        run: cargo build -p rvl --bin cindex --bin rustindex

      # The C# live tests build csindex and diff its output against the
      # committed golden stream (po-av01j.57). Under CI a missing SDK fails
      # them instead of skipping, so this step is what keeps the lane covered:
      # a skip here once hid a csindex that did not compile (po-av01j.47).
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # The engines of the other lanes. The live tests build goindex with the
      # Go toolchain, run tsindex under node against its own `typescript`, and
      # run javaindex in source-file mode on a JDK. None of these was installed
      # in this job before po-av01j.99: the tests found whatever the runner
      # image had, and skipped the rest.
      - uses: actions/setup-go@v7
        with:
          go-version-file: helpers/goindex/go.mod
          cache-dependency-path: helpers/goindex/go.sum
          cache: ${{ vars.CI_RUNNER == '' }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: helpers/tsindex/package.json

      - name: Install the tsindex dependencies
        working-directory: helpers/tsindex
        run: npm ci

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # cindex loads libclang at process START (clang-sys `runtime`), so the
      # build above succeeds on a runner with no libclang and proves nothing
      # about the C/C++ lane. This puts the engine a release ships, pinned and
      # checksummed in crates/cindex/libclang.pin, beside the cindex the tests
      # run. No package manager and no sudo, and the goldens are held to the
      # same library users get.
      - name: Fetch the pinned libclang
        # A block scalar: the sed expression holds a colon and a space, which
        # ends a plain YAML scalar and makes the whole workflow unparseable.
        run: |
          ci/fetch-libclang.sh "$(rustc -vV | sed -n 's/^host: //p')" target/debug

      # Assert the engine, not the build. The tests fail on a missing engine
      # too (RVLSCAN_REQUIRE_ENGINES), but this says which one in one line.
      - name: Every engine is available
        run: |
          target/debug/cindex --engine-check
          (cd helpers/tsindex && node -e "require('typescript')")
          go version
          javac -version
          rust-analyzer --version
          python3 --version
          dotnet --version

      - name: Test
        run: cargo test --workspace

  # helpers: go vet and go test for goindex, plus pyindex and tsindex.
  helpers:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Reclaim workspace ownership (self-hosted runner hygiene)
        if: ${{ vars.CI_RUNNER != '' }}
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_WORKSPACE" 2>/dev/null || true

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: helpers/goindex/go.mod
          cache-dependency-path: helpers/goindex/go.sum
          # Same reasoning as the Rust cache above: the module and build cache
          # already persist on local disk on the self-hosted fleet.
          cache: ${{ vars.CI_RUNNER == '' }}

      - name: Verify pinned dependencies
        working-directory: helpers/goindex
        run: go mod verify

      - name: Vet
        working-directory: helpers/goindex
        run: go vet ./...

      - name: Test
        working-directory: helpers/goindex
        run: go test ./...

      - name: Packet schema is declared
        working-directory: helpers/goindex
        run: |
          # A consumer negotiates on this number before paying for a load;
          # it must always be printable without loading anything.
          test -n "$(go run . -packet-schema)"

      # The Python and TypeScript helpers ship with their own suites, and
      # the test-path skip is pinned there and nowhere else: the
      # rvl cli tests drive the Python lane live but never the TypeScript
      # one. A suite CI never runs is a contract nothing enforces.
      - name: pyindex tests
        working-directory: helpers/pyindex
        run: python3 -m unittest

      - uses: actions/setup-node@v7
        with:
          node-version-file: helpers/tsindex/package.json

      - name: tsindex tests
        working-directory: helpers/tsindex
        run: |
          npm ci
          node --test

      - name: No internal codenames
        run: |
          # concatenated so this pattern never matches its own source
          if grep -rIn --exclude-dir=.git --exclude-dir=target -i "pola""ris" .; then
            echo "internal codename found; the product name is Revelara" >&2
            exit 1
          fi

  # The one check run the merge queue reads, and the one a ruleset can require.
  # `check` and `helpers` are named in the queue config: do not rename them.
  # always() makes this job run when a need failed or was cancelled, so that
  # case reports a failure instead of a skipped (and so passing) check. The
  # event list is every trigger this workflow has, so the condition is always()
  # in effect; the merge queue's workflow guard needs to read workflow_dispatch
  # by name in it.
  ci-gate:
    name: ci-gate
    needs: [check, helpers]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Every test job succeeded
        run: |
          # A dispatched or push run must see success from every job. Only a
          # pull_request may also pass on skipped, which the merge queue's
          # workflow guard requires of every gate; neither job has an `if:`
          # today, so on a pull_request they are never skipped.
          for r in "${{ needs.check.result }}" "${{ needs.helpers.result }}"; do
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              case "$r" in success|skipped) ;; *) echo "ci-gate: a test job was $r" >&2; exit 1 ;; esac
            else
              [ "$r" = "success" ] || { echo "ci-gate: a test job was $r" >&2; exit 1; }
            fi
          done
