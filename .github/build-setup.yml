# NOT A WORKFLOW. This is a fragment of STEPS spliced into dist's per-target
# build job, named by `github-build-setup` in dist-workspace.toml.
#
# It lived in .github/workflows/ until 2026-08-16, which made GitHub Actions
# try to run it as a workflow on every push. It has no `on:` and no `jobs:`,
# so every one of those runs failed to parse — a permanently red entry in the
# Actions tab that was never a real failure, and that made genuine failures
# easy to miss. Moved here; `github-build-setup` resolves relative to
# .github/workflows/, hence the `../`.
#
# Do NOT move it back under workflows/.
#
# Extra steps spliced into dist's per-target build job (dist `github-build-setup`).
#
# goindex is the one retriever cargo cannot build (po-aml3h). Without this it
# is absent from the release archive, and a fresh `brew install rvl`
# followed by a scan of any Go repository hard-fails with "no goindex helper
# found" — the exact class of first-run failure this bead removes.
#
# The output lands in `crates/rvl/dist-extras/goindex`, which
# `[package.metadata.dist] include` packs into the archive next to the rvl
# binary; resolution then finds it with no environment set. The build MUST run
# before `dist build`, which is where dist splices these steps in.
- name: Install Go (for the goindex retriever)
  uses: actions/setup-go@v7
  with:
    go-version-file: helpers/goindex/go.mod
    cache: false
- name: Cross-build goindex for this target
  shell: bash
  run: |
    set -euo pipefail
    targets=(${{ join(matrix.targets, ' ') }})
    # `include` names ONE static path, so a job building two targets would
    # silently ship the second one's binary for both. Fail instead.
    if [ "${#targets[@]}" -ne 1 ]; then
      echo "goindex packaging assumes one target per job, got: ${targets[*]}" >&2
      exit 1
    fi
    case "${targets[0]}" in
      x86_64-apple-darwin)     export GOOS=darwin GOARCH=amd64 ;;
      aarch64-apple-darwin)    export GOOS=darwin GOARCH=arm64 ;;
      x86_64-unknown-linux-*)  export GOOS=linux  GOARCH=amd64 ;;
      aarch64-unknown-linux-*) export GOOS=linux  GOARCH=arm64 ;;
      *) echo "no GOOS/GOARCH mapping for ${targets[0]}" >&2; exit 1 ;;
    esac
    # CGO off so the helper is static and cross-builds without a C toolchain;
    # goindex drives the `go` tool at runtime, not libc-linked analysis.
    out="$GITHUB_WORKSPACE/crates/rvl/dist-extras/goindex"
    mkdir -p "$(dirname "$out")"
    CGO_ENABLED=0 go build -C helpers/goindex -trimpath -o "$out" .
    chmod +x "$out"
    file "$out" || true
# The pinned libclang cindex loads in a release (po-av01j.49). Engine pin
# po-ae75b.9: release scan results must not depend on the scanning machine's
# clang, so the archive carries one. ci/fetch-libclang.sh reads
# crates/cindex/libclang.pin, verifies every download's sha256 and FAILS this
# job on a mismatch; it writes crates/rvl/dist-extras/libclang/, which
# `include` packs beside cindex.
#
# CINDEX_REQUIRE_VENDORED_LIBCLANG reaches `dist build`'s cargo through
# GITHUB_ENV and is read at COMPILE time: a release cindex whose bundle is
# missing fails closed instead of quietly scanning with the system clang.
- name: Fetch the pinned libclang for this target
  shell: bash
  run: |
    set -euo pipefail
    targets=(${{ join(matrix.targets, ' ') }})
    if [ "${#targets[@]}" -ne 1 ]; then
      echo "libclang packaging assumes one target per job, got: ${targets[*]}" >&2
      exit 1
    fi
    ci/fetch-libclang.sh "${targets[0]}" "$GITHUB_WORKSPACE/crates/rvl/dist-extras"
    echo "CINDEX_REQUIRE_VENDORED_LIBCLANG=1" >> "$GITHUB_ENV"
